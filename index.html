<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alvin Khoirul | Creative Portfolio</title>

  <link rel="icon" type="image/webp" href="./src/assets/image/logo.webp" />

  <!-- Google Fonts: Syne & Outfit only -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Outfit:wght@300..900&display=swap"
    rel="stylesheet" />
  <meta name="theme-color" content="#000000" />
</head>

<body class="bg-black text-white selection:bg-white selection:text-black">
  <div id="root"></div>
  <script>
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      document.getElementById("root").innerHTML = "<div style='color:red; background:black; padding:20px; z-index:9999; position:fixed; top:0; left:0; width:100%; height:100vh;'><h1>GLOBAL CRASH</h1><p>" + msg + "</p><pre>" + (error && error.stack ? error.stack : "") + "</pre></div>";
      return false;
    };
    window.addEventListener("unhandledrejection", function (e) {
      document.getElementById("root").innerHTML = "<div style='color:red; background:black; padding:20px; z-index:9999; position:fixed; top:0; left:0; width:100%; height:100vh;'><h1>PROMISE CRASH</h1><p>" + e.reason + "</p></div>";
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
