<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProfileApps</title>

    <!-- Favicon -->
    <link rel="icon" href="./src/assets/image/logo.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Outfit:wght@300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-black text-white selection:bg-white selection:text-black">
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        document.getElementById("root").innerHTML = "<div style='color:red; background:black; padding:20px; z-index:9999; position:fixed; top:0; left:0; width:100%; height:100vh;'><h1>GLOBAL CRASH</h1><p>" + msg + "</p><pre>" + (error && error.stack ? error.stack : "") + "</pre></div>";
        return false;
      };
      window.addEventListener("unhandledrejection", function(e) {
        document.getElementById("root").innerHTML = "<div style='color:red; background:black; padding:20px; z-index:9999; position:fixed; top:0; left:0; width:100%; height:100vh;'><h1>PROMISE CRASH</h1><p>" + e.reason + "</p></div>";
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
